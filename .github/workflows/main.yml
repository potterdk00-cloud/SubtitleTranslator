name: Build SubtitleTranslator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-fix all nested folders
        run: |
          mkdir -p /tmp/fixed_src/main/res/layout
          mkdir -p /tmp/fixed_src/main/java/com/example/subtitletranslator

          MANIFEST=$(find app -name "AndroidManifest.xml" | head -n 1)
          LAYOUT=$(find app -name "activity_main.xml" | head -n 1)
          MAIN_KT=$(find app -name "MainActivity.kt" | head -n 1)

          cp "$MANIFEST" /tmp/fixed_src/main/AndroidManifest.xml
          cp "$LAYOUT" /tmp/fixed_src/main/res/layout/activity_main.xml
          cp "$MAIN_KT" /tmp/fixed_src/main/java/com/example/subtitletranslator/MainActivity.kt

          rm -rf app/src
          mkdir -p app/src
          cp -r /tmp/fixed_src/* app/src/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
